[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atmosphere-orbit"
version = "0.1.0"
description = "Local surface-to-orbit engineering analysis"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.14", "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.9", "astropy>=7.0", "pymsis>=0.12", "rasterio>=1.4", "httpx>=0.27", "python-multipart>=0.0.20", "shapely>=2.0", "netCDF4>=1.7", "casadi>=3.7.2"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
atmosphere = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
